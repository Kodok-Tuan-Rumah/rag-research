name: Quality gate

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Labeled dataset (relative to repo root)"
        default: "data/evaluation/retrieval_eval_dataset_v2.json"
      limit:
        description: "Number of queries to run (blank = all)"
        default: ""
      top_k:
        description: "top_k for retrieval"
        default: "10"

jobs:
  ragas:
    name: RAGAS on ${{ github.event.inputs.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the native Rust chunker
        uses: dtolnay/rust-toolchain@stable

      - name: maturin develop
        run: maturin develop --manifest-path src/ingestion/semantic_chunker_rust/Cargo.toml

      - name: Install the project itself
        run: python -m pip install -e . --no-deps
      - name: Run answer-quality evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --dataset "${{ github.event.inputs.dataset }}" \
            --limit ${{ github.event.inputs.limit || '999' }} \
            --top-k ${{ github.event.inputs.top_k || '10' }}

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation-run-report
          path: |
            results/metrics/generation_run_report.json
            results/metrics/ragas_results.json

      - name: Summarise
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("results/metrics/generation_run_report.json")
          if not p.exists():
              print("no report produced"); raise SystemExit(0)
          d = json.loads(p.read_text())
          print("pipeline:", json.dumps(d["pipeline"], indent=2))
          r = d.get("ragas")
          if not r:
              print("ragas: not scored (all queries abstained or errored)"); raise SystemExit(0)
          for k in ("avg_faithfulness","avg_answer_relevancy","avg_context_precision",
                    "avg_context_recall","avg_answer_correctness","hallucination_rate",
                    "total_samples","nan_counts"):
              print(f"{k}: {r.get(k)}")
          PY
