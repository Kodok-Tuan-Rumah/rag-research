name: CI

# Replaces the previous `rag-eval` job, which ran
#   python scripts/eval_ci.py --eval-dir data/adversarial
# against data/adversarial/adversarial_queries.json. That file holds queries
# with `should_abstain` and no reference answers, so load_samples() raised
# "Evaluation row 0 is not RAGAS-ready" on every single run. The job could not
# pass and had never passed.
#
# Answer-quality measurement needs a Groq key and minutes of API time, so it
# moved to the manual `quality-gate` workflow. What runs here instead is the
# part that fails silently.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares >=3.12 but that was never verified; the local
        # environment is 3.14 and every shim in src/_compat.py exists because
        # of it. Running both turns "does the stack install on 3.12" from an
        # assumption into a measured fact on the first run.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the native Rust chunker
        # Mirrors scripts/bootstrap_env.sh step 3. Without it
        # src/ingestion/semantic_chunker.py raises ImportError, because it
        # hard-raises rather than falling back to a Python implementation.
        uses: dtolnay/rust-toolchain@stable

      - name: maturin develop
        run: maturin develop --manifest-path src/ingestion/semantic_chunker_rust/Cargo.toml

      - name: Install the project itself
        run: python -m pip install -e . --no-deps

      - name: Run unit tests
        run: python -m pytest -q

  contracts:
    name: contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the native Rust chunker
        uses: dtolnay/rust-toolchain@stable

      - name: maturin develop
        run: maturin develop --manifest-path src/ingestion/semantic_chunker_rust/Cargo.toml

      - name: Install the project itself
        run: python -m pip install -e . --no-deps

      - name: Import surface and dataset integrity
        # Three checks that used to have no home:
        #  - every src/ module imports (caught nothing for months: ragas needed
        #    langchain_community.chat_models.vertexai, and ragas/executor.py
        #    calls nest_asyncio.apply() at module level, breaking
        #    asyncio.wait_for on 3.14 so every RAGAS metric returned NaN and
        #    was reported as 0.0)
        #  - every labeled dataset still resolves against the corpus
        #  - every labeled dataset is readable by the evaluator. Validation
        #    accepts the legacy aliases source_chunk / chunk_id / gold_chunk;
        #    normalize_gold_chunk_ids() does not, and run_retrieval_eval.py
        #    calls it without try/except. Without this third check the gate
        #    passed datasets that abort the whole evaluation run.
        run: python scripts/check_ci_contracts.py