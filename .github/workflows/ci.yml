name: CI

on:
  push:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]
  pull_request:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]
  workflow_dispatch:

jobs:
  tests:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the native Rust chunker
        uses: dtolnay/rust-toolchain@stable

      - name: Install the native Rust extension
        run: python -m pip install ./src/ingestion/semantic_chunker_rust --no-deps --no-build-isolation

      - name: Install the project itself
        run: python -m pip install -e . --no-deps

      - name: Run unit tests
        run: python -m pytest -q

  contracts:
    name: contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the native Rust chunker
        uses: dtolnay/rust-toolchain@stable

      - name: Install the native Rust extension
        run: python -m pip install ./src/ingestion/semantic_chunker_rust --no-deps --no-build-isolation

      - name: Install the project itself
        run: python -m pip install -e . --no-deps

      - name: Import surface and dataset integrity
        run: python scripts/check_ci_contracts.py

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real Groq keys in tracked files
        run: |
          if grep -rqE 'gsk_[A-Za-z0-9]{30,}' --exclude-dir=.git .; then
            echo "::error::Real-looking Groq key found in tracked files!"; exit 1
          fi
          echo "clean ✓"
