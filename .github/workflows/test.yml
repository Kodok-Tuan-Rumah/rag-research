name: CI

on:
  push:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]
  pull_request:
    branches: [main, master, remediation/2026-10-24, "remediation/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Build Rust extension (optional)
          if command -v cargo &> /dev/null; then
            pip install maturin
            cd src/ingestion/semantic_chunker_rust && maturin develop --release 2>/dev/null || true
            cd ../../..
          fi
      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short