[package]
name = "cross_encoder_reranker"
version = "0.1.0"
edition = "2021"

[lib]
name = "cross_encoder_reranker"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ort = { version = "=2.0.0-rc.15", features = ["ndarray", "load-dynamic"] }
tokenizers = "0.20"
ndarray = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
