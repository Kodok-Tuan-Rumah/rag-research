# rag-research — Mode B (per proyek) untuk rag-api
#
# ⚠️ Stack KANONIK = root compose (`make up` di root workspace, container
#    ws-rag-api). File ini adalah HELPER mode B: menjalankan rag-api STANDALONE
#    dengan menempel ke jaringan root — ia TIDAK men-definisikan Qdrant
#    sendiri, jadi root stack harus sudah hidup (alias `qdrant` dari ws-net
#    yang dipakai ulang). RAG runtime saat ini tidak memakai Ollama.
#
# Pemakaian:
#   cd rag-research
#   docker compose --env-file ../.env up -d rag-api   # key ikut dari .env root
#   # sebelum kembali ke Mode A:
#   docker compose -p rag-research down              # (nama proyek default = folder)
#   cd .. && make up                                  # restore ws-rag-api
#
# JANGAN jalankan Mode B saat Mode A aktif — bentrok port 8000 & alias
# `rag-api` di jaringan bersama (lihat docs/ops-postmortem.md S-5 + README).

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: http://qdrant:6333
      GROQ_MODEL: openai/gpt-oss-20b
      # GroqGenerator requires this key during API startup; there is no local
      # Ollama fallback in the current runtime.
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in ../.env or the shell environment}
      # Redis only exists in the root stack's monitoring profile.
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ws-net

networks:
  ws-net:
    external: true
    name: ai-infra-workspace_ws-net
