[package]
name = "rag-inference"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rag-inference"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", features = ["ndarray", "load-dynamic"] }
tokenizers = "0.20"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
